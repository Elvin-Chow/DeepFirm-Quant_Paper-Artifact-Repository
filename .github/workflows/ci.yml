name: Paper Reproducibility CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate crisis warning contracts
        run: python scripts/validate_crisis_warning_contract.py

      - name: Run paper guardrail tests
        run: >-
          python -m pytest
          tests/test_crisis_warning_engine.py
          tests/test_crisis_warning_artifacts.py
          tests/test_oos_allocation_integrity.py
          tests/test_oos_guard_thresholds.py
          tests/test_data_provenance_and_oos.py
          tests/test_experiments_framework.py
          -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
